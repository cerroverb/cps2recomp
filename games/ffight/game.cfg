# SPDX-License-Identifier: GPL-3.0-only
#
# Final Fight (Capcom 1989, CPS-1 arcade board): per-game settings read by the cps2recomp toolkit (Makefile, tools
# and launcher via tools/gamecfg.py). A first port: the game as the board plays it, translated, with its FM music
# (YM2151) and its voices and effects (OKI), and no sources of its own yet.

# (no apostrophe or colon: the name is also the folder the player's settings are kept under)
name = Final Fight
# What the window is called (the name stays the folder the player's settings are kept under)
title = Final Fight Recomp
id = ffight
app_id = io.github.cerroverb.ffight
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# ffight is the World release (set 1), the parent set.
rom_set = ffight
rom_parent = ffight
rom_name = Final Fight (World, set 1)

# The board: a classic CPS-1 with no QSound, its 68000 at 10 MHz (MAME's cps1_10MHz). Its CPS-B-04 (MAME's
# cps1_v.cpp table, CPS_B_04): layer control, the four priority masks, palette control, the layer enable bits, then
# its ID register and what it reads (byte offsets, hex)
board = cps1-classic pairs=2
cpu_clock = 10
cps_b = 2E 26 30 28 32 2A 02 04 08 20 0004
# Its graphics mapper (the PAL S224B, as MAME's table has it): one bank of 8000; objects 0-43ff, scroll 1 4400-4bff,
# scroll 3 4c00-5fff, scroll 2 6000-7fff.
gfx_map = 8000 | objects:0-43ff:0 scroll1:4400-4bff:0 scroll3:4c00-5fff:0 scroll2:6000-7fff:0
# The DIP switches (banks A, B and C, hex), as MAME's ffight inputs set them: 1 coin 1 credit, difficulty level 1
# normal (4), difficulty level 2 normal, a bonus life at 100k, 2 lives, the demonstrations' sound, continues allowed
dip = FF F4 9F
# The Board page (the menu's and the launcher's): the DIP switches by name, each "As the board is set" (dip, above)
# unless chosen. name | title | bank:bits | description | choice=value ... (MAME's ffight inputs). The game copies the
# switches to its work RAM every frame, but decodes all but the demonstrations' sound once, as it starts (the listing's
# routine at 000D46, called only from the start-up); the demonstrations' sound it decodes every frame (000E42, from
# the frame interrupt).
board_option_1 = board_difficulty | Difficulty | B:0-2 | Difficulty level 1. A new board: 4 (normal). Takes effect after Reset: the board reads it as it starts. | 1 (easiest)=7 | 2=6 | 3=5 | 4 (normal)=4 | 5=3 | 6=2 | 7=1 | 8 (hardest)=0
board_option_2 = board_difficulty_2 | Difficulty 2 | B:3-4 | Difficulty level 2. A new board: 2 (normal). Takes effect after Reset: the board reads it as it starts. | 1 (easy)=3 | 2 (normal)=2 | 3 (hard)=1 | 4 (hardest)=0
board_option_3 = board_lives | Lives | C:0-1 | Lives for each credit. A new board: 2. Takes effect after Reset: the board reads it as it starts. | 1=0 | 2=3 | 3=2 | 4=1
board_option_4 = board_extend | Bonus life | B:5-6 | The scores that give a life. A new board: 100K. Takes effect after Reset: the board reads it as it starts. | 100K=3 | 200K=2 | 100K and every 200K=1 | None=0
board_option_5 = board_continue | Continue | C:6 | Whether a game over can be continued. A new board: yes. Takes effect after Reset: the board reads it as it starts. | No=1 | Yes=0
board_option_6 = board_two_coins | 2 coins to start | A:6 | Two credits to start a game, one to continue. A new board: off. Takes effect after Reset: the board reads it as it starts. | Off=1 | On=0
board_option_7 = board_demo_sound | Demo sound | C:5 | Whether the attract mode plays sound. A new board: on. The board reads it all the time: it applies at once. | Off=1 | On=0

# Capcom's video library, native in the toolkit (video/lifts.cpp, docs/NATIVE_VIDEO.md): video_writes, the
# instructions that write the video's registers (CPS-A's, and CPS-B's layer control, priority masks and palette
# control): every move or clr to one in the listing, with those a census of 6000 frames of attract mode saw
# (CPS2RECOMP_VIDEO_CENSUS)
video_writes = 000554 00055C 000564 00056C 00057E 000584 00058C 000594 0005F0 000602 000614 000644
video_writes = 00064A 000650 000666 00067A 0006B0 0006B6 0006BC 0006D8 0021F6 0021FE 002206 05DAA0
video_writes = 05DAA8 05E010 05E018 05E7D0 05E7D8 05E7E0 05E7E8 05E7F0 05E7F8 05E800 05E808 05EB7C
video_writes = 05EB84

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board (MAME's ROM_START( ffight )).
# program: the 68000's ROMs: two pairs of files giving the even and odd bytes (board's pairs=2), then a file of 16-bit
# words low byte first (MAME ROM_LOAD16_WORD_SWAP, so no /be). graphics: four files side by side (two bytes of the 64-bit words each).
# sound_program: the Z80's ROM. samples: the OKI's two ROMs.
program = ff_36.11f:f9a5ce83 ff_42.11h:65f11215 ff_37.12f:e1033784 ffe_43.12h:995e968a ff-32m.8h:c747696e
graphics = ff-5m.7a:9c284108 ff-7m.9a:a7584dfb ff-1m.3a:0b605e44 ff-3m.5a:52291cd2
sound_program = ff_09.12b:b8367eb5
samples = ff_18.11c:375c66e7 ff_19.12c:1ef137f9

# Up to two players at once, and what the game calls its buttons (MAME's cps1_3b: the third is unused)
players = 2
buttons = Attack | Jump

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this (the whole program
# until made-up play shows where the code stops)
code_end = 100000
